#===============================================================================
# Program   : KitBIOS
# File Name : memory.conf
# Project   : Kit-2 8-bit Computer
# Author    : Ryan Clarke
# E-mail    : kj6msg@icloud.com
#-------------------------------------------------------------------------------
# Purpose   : Linker configuration file for KitBIOS.
#===============================================================================


MEMORY
    {
    ZP:
        start  = $0000,
        size   = $0100;
    
    STACK:
        start  = $0100,
        size   = $0100;
    
    IO:
        start  = $0200,
        size   = $0100,
        define = yes;
    
    RAM:
        start  = $0300,
        size   = $ED00,
        define = yes;
    
    KITBIOS:
        start  = $F000,
        size   = $1000,
        fill   = yes,
        file   = %O,
        define = yes;
    }

SEGMENTS
    {
    CODE:
        load  = KITBIOS,
        type  = rw;
    
    RODATA:
        load  = KITBIOS,
        type  = ro;
    
    BSS:
        load  = KITBIOS,
        type  = bss;
    
    VECTORS:
        load  = KITBIOS,
        type  = ro,
        start = $FFFA;
    }
